<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn page mockup</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:26px 22px 40px;background:#F4F5F8;color:#15181F;
    font:400 14px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 3px;font-weight:700}
  .dek{color:#5A6273;font-size:12.5px;margin:0 0 22px;max-width:70ch}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0;width:375px}
  figcaption{font-size:11.5px;color:#5A6273;line-height:1.55;margin-top:10px}
  .tag{display:inline-block;font-size:8.5px;letter-spacing:.16em;font-weight:800;padding:2px 7px;
    border-radius:20px;background:#E7EBF3;color:#4A5878;margin-right:7px}
  .frame{width:375px;border-radius:26px;overflow:hidden;border:1px solid #C9CFDC;
    box-shadow:0 10px 34px rgba(20,26,45,.16);background:#070B18}
  .status{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;
    font-size:10px;color:#8FA0C8;letter-spacing:.04em}
  .dots{letter-spacing:-2px;font-size:7px}
  /* ---- the page itself, in the lesson pages' own night ---- */
  .scr{background:radial-gradient(1000px 500px at 50% -170px,#16223E 0%,#0B1226 46%,#070B18 100%);
    padding:6px 13px 0;min-height:660px;display:flex;flex-direction:column;gap:11px}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 0 2px}
  .ic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.05);
    border:1px solid #26325A;color:#9FB0D8;font-size:14px;cursor:pointer}
  .ttl{text-align:center;font:700 21px/1 Georgia,'Times New Roman',serif;letter-spacing:.16em;color:#EAF0FF}
  .ttl em{display:block;font:400 9.5px/1 ui-sans-serif,system-ui;letter-spacing:.16em;color:#C8A96A;
    margin-top:5px;font-style:normal}
  .one{background:linear-gradient(180deg,#16203C,#111A32);border:1px solid #35DFF6;border-radius:15px;
    padding:15px 15px 14px;box-shadow:0 0 26px rgba(53,223,246,.14)}
  .kick{font-size:9px;letter-spacing:.2em;font-weight:800;color:#35DFF6}
  .one h3{margin:7px 0 3px;font:700 25px/1.1 Georgia,serif;color:#F2F6FF;letter-spacing:.01em}
  .one p{margin:0;font-size:13px;color:#B9C6E8;line-height:1.45}
  .meta{margin-top:9px;font-size:10.5px;color:#7F8FBC;letter-spacing:.02em}
  .cta{margin-top:12px;width:100%;border:none;border-radius:11px;padding:13px 0;cursor:pointer;
    background:linear-gradient(180deg,#4BE7FA,#25C6E0);color:#04121B;
    font:800 13px/1 ui-sans-serif,system-ui;letter-spacing:.18em}
  .ev{background:#101B33;border:1px solid #26325A;border-left:3px solid #FFC65A;border-radius:12px;padding:11px 13px}
  .evk{font-size:8.5px;letter-spacing:.17em;font-weight:800;color:#FFC65A}
  .ev p{margin:5px 0 0;font-size:12.5px;color:#CFDAF5;line-height:1.5}
  .ev p b{color:#FFE7B4}
  .evb{margin-top:9px;background:none;border:1px solid rgba(53,223,246,.45);border-radius:9px;
    color:#35DFF6;font:800 10px/1 ui-sans-serif,system-ui;letter-spacing:.14em;padding:8px 13px;cursor:pointer}
  .lad{display:flex;align-items:center;gap:10px;background:#0E1730;border:1px solid #212C52;
    border-radius:11px;padding:11px 13px}
  .lad span{font-size:9px;letter-spacing:.17em;font-weight:800;color:#93A4D0}
  .bar{flex:1;height:5px;border-radius:3px;background:#1E2A4C;overflow:hidden;font-style:normal}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#35DFF6,#8FE9FF);border-radius:3px;font-style:normal}
  .lad em{font-style:normal;font-size:11px;color:#C7D3F0;font-variant-numeric:tabular-nums}
  .lib{width:100%;text-align:left;background:linear-gradient(180deg,#181231,#120E26);
    border:1px solid #362B63;border-radius:12px;padding:12px 13px;cursor:pointer;display:block}
  .libt{display:block;font-size:11px;letter-spacing:.18em;font-weight:800;color:#D7C9F6}
  .libs{display:block;font-size:10.5px;color:#9186BE;margin-top:3px}
  .then{background:#0E1730;border:1px solid #212C52;border-radius:12px;padding:12px 13px}
  .then b{display:block;font-size:9px;letter-spacing:.18em;color:#93A4D0}
  .then span{display:block;font-size:12.5px;color:#CFDAF5;margin-top:3px}
  .whisper{margin:0;text-align:center;font-size:10.5px;color:#6B7AA6}
  .done{background:#0F2419;border:1px solid #2B5540;border-radius:12px;padding:11px 13px}
  .done b{display:block;font-size:9px;letter-spacing:.18em;color:#5FE0A0}
  .done span{display:block;font-size:11.5px;color:#9FD8B6;margin-top:3px}
  .nav{margin:auto -13px 0;display:flex;background:#0A1020;border-top:1px solid #1C2749;padding:7px 0 9px}
  .nav a{flex:1;text-align:center;font-size:9px;color:#6E7CA6;letter-spacing:.02em}
  .nav a i{display:block;font-style:normal;font-size:15px;margin-bottom:3px}
  .nav a.on{color:#35DFF6}
</style></head><body>
<h1>The proposed Learn page</h1>
<p class="dek">At true phone width, in the night the lesson pages already use. Three lives of the same
five slots &mdash; the one answer, the evidence, the ladder, the library. Empty slots do not render.</p>
<div class="row">
<figure>
  <div class="frame">
    <div class="status"><span>9:41</span><span class="dots">&#9679;&#9679;&#9679;&#9679;</span></div>
    <div class="scr">
      <div class="hdr">
        <button class="ic">&#8592;</button>
        <div class="ttl">ACADEMY<em>Learn by doing.</em></div>
        <button class="ic">&#9906;</button>
      </div>
      <div class="one">
        <span class="kick">START HERE</span>
        <h3>How to play</h3>
        <p>Never played KenKen? Every rule, from zero.</p>
        <div class="meta">25 steps &middot; playable</div>
        <button class="cta">BEGIN</button>
      </div>
      <div class="then">
        <b>THEN</b>
        <span>The 16 lessons, one idea at a time.</span>
      </div>
      <p class="whisper">Practice, the library and your field notes open up as you go.</p>
      <nav class="nav">
        <a><i>&#9776;</i>Store</a><a><i>&#9638;</i>Arcade</a><a><i>&#9906;</i>Campaign</a>
        <a><i>&#9786;</i>Versus</a><a class="on"><i>&#9906;</i>Learn</a>
      </nav>
    </div>
  </div>
  <figcaption><span class="tag">GREEN</span>Nothing but the one thing that matters. The other destinations are named in a single sentence, not five greyed rows.</figcaption>
</figure>
<figure>
  <div class="frame">
    <div class="status"><span>9:41</span><span class="dots">&#9679;&#9679;&#9679;&#9679;</span></div>
    <div class="scr">
      <div class="hdr">
        <button class="ic">&#8592;</button>
        <div class="ttl">ACADEMY<em>Learn by doing.</em></div>
        <button class="ic">&#9906;</button>
      </div>
      <div class="one">
        <span class="kick">CONTINUE</span>
        <h3>The Cast</h3>
        <p>Who to take down, and why.</p>
        <div class="meta">Lesson 2 of 16 &middot; ~5 min &middot; Dr. Tez</div>
        <button class="cta">RESUME</button>
      </div>
      <div class="ev">
        <span class="evk">WHAT YOUR SOLVING SHOWED</span>
        <p>&divide; cages run <b>4.1s</b> a number &mdash; your slowest lane by a wide margin.</p>
        <button class="evb">TAKE THE DRILL &rsaquo;</button>
      </div>
      <div class="lad">
        <span>LESSONS</span><i class="bar"><i style="width:9%"></i></i><em>1/16</em>
      </div>
      <button class="lib">
        <span class="libt">THE LIBRARY</span>
        <span class="libs">Miyamoto&rsquo;s Classroom &middot; The Margins &middot; Originals</span>
      </button>
      <nav class="nav">
        <a><i>&#9776;</i>Store</a><a><i>&#9638;</i>Arcade</a><a><i>&#9906;</i>Campaign</a>
        <a><i>&#9786;</i>Versus</a><a class="on"><i>&#9906;</i>Learn</a>
      </nav>
    </div>
  </div>
  <figcaption><span class="tag">WORKING</span>The evidence sits second, where it is the most useful thing on the page. The ladder is a receipt.</figcaption>
</figure>
<figure>
  <div class="frame">
    <div class="status"><span>9:41</span><span class="dots">&#9679;&#9679;&#9679;&#9679;</span></div>
    <div class="scr">
      <div class="hdr">

        <button class="ic">&#9906;</button>
      </div>
      <div class="one">
        <span class="kick">PRACTICE</span>
        <h3>The Next Move</h3>

      </div>
      <div class="ev">
        <span class="evk">WHAT YOUR SOLVING SHOWED</span>
        <p>7&times;7 is your stretch band now. A month ago it was 6&times;6.</p>

      <button class="lib">
        <span class="libt">THE LIBRARY</span>

      <div class="done">

        <span>16 of 16 lessons. The ladder is behind you.</span>

      <nav class="nav">
        <a><i>&#9776;</i>Store</a><a><i>&#9638;</i>Arcade</a><a><i>&#9906;</i>Campaign</a>
        <a><i>&#9786;</i>Versus</a><a class="on"><i>&#9906;</i>Learn</a>

</figure></div>
</body></html>
