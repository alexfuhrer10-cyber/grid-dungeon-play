<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NINE BOXES</title>
<link rel="stylesheet" href="_shell.css">
<script src="_shell.js"></script>
<style>
  #grid{display:grid;grid-template-columns:repeat(9,42px);background:#0d0920;
    border:3px solid var(--info);border-radius:5px;box-shadow:0 0 34px #22e0ff22}
  .c{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;cursor:pointer;
    border-right:1px solid #ffffff10;border-bottom:1px solid #ffffff10;color:var(--ok)}
  .c.br{border-right:2px solid #ffffff3a}
  .c.bb{border-bottom:2px solid #ffffff3a}
  .c.given{color:var(--ink);background:#171130}
  .c.sel{background:#12303a;box-shadow:inset 0 0 0 2px var(--gold)}
  .c.peer{background:#ffffff08}
  .c.same{background:#1b2a44}
  .c.bad{color:var(--rot)}
  .nt{font-size:9px;font-weight:800;color:var(--myst);letter-spacing:1px;line-height:1}
  .pad{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;width:378px}
  .pad button{width:auto;flex:1 1 36px;padding:12px 0;font-size:16px;
    border-color:var(--info);color:var(--info);background:#12233a}
  .pad button.era{flex:1 1 80px;font-size:11px;border-color:var(--line);color:var(--dim);background:transparent}

  /* ---- ON PAPER ---- */
  .paper #grid{background:#fffdf8;border-color:var(--info)}
  .paper .c{border-right-color:#00000018;border-bottom-color:#00000018;color:var(--ok)}
  .paper .c.br{border-right-color:#00000055}
  .paper .c.bb{border-bottom-color:#00000055}
  .paper .c.given{background:#00000010;color:var(--ink)}
  .paper .c.sel{background:#0e7fa826}
  .paper .c.peer{background:#00000009}
  .paper .c.same{background:#0e7fa814}
  .paper .nt{color:var(--myst)}
  .paper .pad button{background:#0e7fa814;border-color:var(--info);color:var(--info)}
  .paper .pad button.era{background:transparent;border-color:#00000026;color:var(--dim)}
</style>
</head>
<body>
<div>
  <div id="grid"></div>
  <div class="pad" id="pad"></div>
  <div id="say"></div>
</div>
<div class="side">
  <h1>NINE BOXES</h1>
  <div class="tag">1 TO 9 IN EVERY ROW,<br>EVERY COLUMN, EVERY BOX.</div>
  <div class="box">
    <div class="lab">EMPTY SQUARES</div><div class="big" id="left">0</div>
    <div class="r"><span class="k">MISTAKES</span><span class="v" id="miss" style="color:var(--rot)">0</span></div>
    <div class="r"><span class="k">DIFFICULTY</span><span class="v" id="diff">EASY</span></div>
  </div>
  <div class="box">
    <div class="lab">CONTROLS</div>
    <div class="keys">
      click a square, then a number<br>
      <kbd>1</kbd>-<kbd>9</kbd> type &nbsp; <kbd>del</kbd> rub out<br>
      <kbd>N</kbd> pencil mode &nbsp; <kbd>shift</kbd>+digit<br>
      arrows move
    </div>
  </div>
  <button id="again">NEW PUZZLE</button>
  <button class="ghost" id="harder" style="margin-top:7px">DIFFICULTY: EASY</button>
</div>
<script>
// NINE BOXES - Sudoku, and it is here for a reason beyond being famous.
//
// Every other puzzle in this cabinet is arithmetic. Sudoku is the one that is
// pure elimination, so it is the natural on-ramp: a player who cannot yet read
// a KenKen cage can already do this, and the row-and-column half of what they
// learn here is exactly the half KenKen needs.
//
// Generated by filling a grid and then removing squares one at a time, keeping
// a removal ONLY while the puzzle still has exactly one answer. That is the same
// law the rest of the game holds itself to.
var $=function(s){return document.querySelector(s);};
var sol,given,cell,sel,miss,level,notes,noting;
var LEVELS=[{n:"EASY",keep:42},{n:"STEADY",keep:34},{n:"HARD",keep:28}];

function rowOf(i){return (i/9)|0;} function colOf(i){return i%9;}
function boxOf(i){return ((rowOf(i)/3)|0)*3 + ((colOf(i)/3)|0);}
function peers(i){
  var out=[],j;
  for(j=0;j<81;j++){
    if(j===i) continue;
    if(rowOf(j)===rowOf(i)||colOf(j)===colOf(i)||boxOf(j)===boxOf(i)) out.push(j);
  }
  return out;
}
function okAt(g,i,v){
  for(var j=0;j<81;j++){
    if(j===i||g[j]!==v) continue;
    if(rowOf(j)===rowOf(i)||colOf(j)===colOf(i)||boxOf(j)===boxOf(i)) return false;
  }
  return true;
}
function fill(g,k){
  if(k===81) return true;
  if(g[k]){ return fill(g,k+1); }
  var vs=[1,2,3,4,5,6,7,8,9],i,j,t;
  for(i=vs.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=vs[i];vs[i]=vs[j];vs[j]=t; }
  for(i=0;i<9;i++){
    if(!okAt(g,k,vs[i])) continue;
    g[k]=vs[i];
    if(fill(g,k+1)) return true;
    g[k]=0;
  }
  return false;
}
// exactly one answer, or it is not a puzzle
function countSol(g,cap){
  var found=0;
  (function rec(){
    if(found>=cap) return;
    var best=-1,bestN=10,i,v,n;
    for(i=0;i<81;i++){
      if(g[i]) continue;
      n=0; for(v=1;v<=9;v++) if(okAt(g,i,v)) n++;
      if(n<bestN){ bestN=n; best=i; if(!n) return; }
    }
    if(best<0){ found++; return; }
    for(v=1;v<=9;v++){
      if(!okAt(g,best,v)) continue;
      g[best]=v; rec(); g[best]=0;
      if(found>=cap) return;
    }
  })();
  return found;
}
function reset(){
  var g=[],i;
  for(i=0;i<81;i++) g.push(0);
  fill(g,0);
  sol=g.slice();
  var order=[]; for(i=0;i<81;i++) order.push(i);
  for(i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i];order[i]=order[j];order[j]=t; }
  var keep=LEVELS[level].keep, shown=81;
  for(var k=0;k<order.length && shown>keep;k++){
    var idx=order[k], save=g[idx];
    g[idx]=0;
    if(countSol(g.slice(),2)!==1){ g[idx]=save; }
    else shown--;
  }
  given=g.map(function(v){return v!==0;});
  cell=g.slice();
  sel=-1; miss=0; notes={}; noting=false;
  say(""); draw();
}
function put(v){
  if(sel<0||given[sel]) return;
  // PENCIL MARKS. Nobody solves a real Sudoku without them: past the easy
  // eliminations the whole technique is holding two or three candidates in a
  // square and looking for the one that cannot survive elsewhere. Without them
  // this was a game you could only play at the level where you never need them.
  if(noting && v){
    if(cell[sel]) return;
    notes[sel]=notes[sel]||{};
    if(notes[sel][v]) delete notes[sel][v]; else notes[sel][v]=1;
    SFX.tick(); draw(); return;
  }
  if(v===0){ cell[sel]=0; say(""); draw(); return; }
  if(v!==sol[sel]){
    miss++; SFX.no(); say("That breaks the row, the column or the box.",true);
    cell[sel]=v; draw();
    setTimeout(function(){ if(cell[sel]!==sol[sel]) { cell[sel]=0; draw(); } },520);
    return;
  }
  cell[sel]=v; delete notes[sel]; SFX.place();
  // a placed number clears that pencil mark from everything it can see
  var ps=peers(sel);
  for(var q=0;q<ps.length;q++) if(notes[ps[q]]) delete notes[ps[q]][v];
  say(""); draw();
  var done=true;
  for(var i=0;i<81;i++) if(!cell[i]) done=false;
  if(done){ SFX.win(); say("Solved with "+miss+" mistake"+(miss===1?"":"s")+"."); }
}
function say(t,bad){ var e=$("#say"); e.textContent=t||""; e.className=bad?"no":""; }
function draw(){
  var h="",i;
  var selV = sel>=0 ? cell[sel] : 0;
  var ps = sel>=0 ? peers(sel) : [];
  for(i=0;i<81;i++){
    var cls="c";
    if(colOf(i)%3===2&&colOf(i)!==8) cls+=" br";
    if(rowOf(i)%3===2&&rowOf(i)!==8) cls+=" bb";
    if(given[i]) cls+=" given";
    if(i===sel) cls+=" sel";
    else if(sel>=0&&ps.indexOf(i)>=0) cls+=" peer";
    if(selV&&cell[i]===selV&&i!==sel) cls+=" same";
    if(cell[i]&&cell[i]!==sol[i]) cls+=" bad";
    var inner=cell[i]||"";
    if(!cell[i]&&notes[i]){
      var ns=Object.keys(notes[i]);
      if(ns.length) inner='<span class="nt">'+ns.sort().join("")+'</span>';
    }
    h+='<div class="'+cls+'" data-i="'+i+'">'+inner+'</div>';
  }
  $("#grid").innerHTML=h;
  var e=0; for(i=0;i<81;i++) if(!cell[i]) e++;
  $("#left").textContent=e;
  $("#miss").textContent=miss;
  $("#diff").textContent=LEVELS[level].n;
  $("#harder").textContent="DIFFICULTY: "+LEVELS[level].n;
  var nb=$("#noteBtn");
  if(nb){ nb.textContent = noting ? "PENCIL ON" : "PENCIL";
    nb.style.color = noting ? "var(--myst)" : "var(--dim)";
    nb.style.borderColor = noting ? "var(--myst)" : "var(--line)"; }
}
$("#grid").addEventListener("click",function(e){
  var d=e.target.closest(".c"); if(!d) return;
  sel=+d.dataset.i; SFX.tick(); draw();
});
(function(){
  var h="",v;
  for(v=1;v<=9;v++) h+='<button data-v="'+v+'">'+v+'</button>';
  h+='<button class="era" data-v="0">RUB OUT</button>';
  h+='<button class="era" id="noteBtn">PENCIL</button>';
  $("#pad").innerHTML=h;
  $("#pad").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.id==="noteBtn"){ noting=!noting; draw(); return; }
    put(+b.dataset.v);
  });
})();
window.addEventListener("keydown",function(e){
  if(e.key==="n"||e.key==="N"){ noting=!noting; draw(); return; }
  if(/^[1-9]$/.test(e.key)) { if(e.shiftKey){ var was=noting; noting=true; put(+e.key); noting=was; } else put(+e.key); return; }
  if(e.key==="Backspace"||e.key==="Delete"){ put(0); return; }
  if(sel<0) return;
  var r=rowOf(sel),c=colOf(sel);
  if(e.key==="ArrowLeft"&&c>0) sel--;
  else if(e.key==="ArrowRight"&&c<8) sel++;
  else if(e.key==="ArrowUp"&&r>0) sel-=9;
  else if(e.key==="ArrowDown"&&r<8) sel+=9;
  else return;
  e.preventDefault(); draw();
});
$("#again").onclick=reset;
$("#harder").onclick=function(){ level=(level+1)%LEVELS.length; reset(); };
window.addEventListener("error",function(e){ say("BROKE: "+e.message,true); });
level=0; reset();
</script>
</body>
</html>
