<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE DOUBLING</title>
<link rel="stylesheet" href="shell.css?v=524">
<script src="shell.js?v=524"></script>
<script>
// draws a demo grid for the tutorial: [{v,k,cl,wr,wb}, ...] rows
function tg(rows){
  var n=rows[0].length, h='<div class="tG" style="grid-template-columns:repeat('+n+',42px)">';
  for(var r=0;r<rows.length;r++) for(var c=0;c<n;c++){
    var x=rows[r][c]||{};
    h+='<div class="tC '+(x.k||"")+(x.wr?" wr":"")+(x.wb?" wb":"")+'">'
      +(x.cl?'<span class="cl">'+x.cl+'</span>':"")+(x.v===undefined?"":x.v)+'</div>';
  }
  return h+'</div>';
}

var LESSON=[
 {who:"kelly", say:"No grid rules in this one. Slide the whole board one way, and <b>two equal numbers touching become one number twice as big</b>.",
  show:'<div class="tDemo">'+tg([[{v:2,k:"ok"},{v:2,k:"ok"},{v:"",k:""},{v:"",k:""}]])
   +'<span style="font-size:22px;color:var(--dim2)">&#8594;</span>'
   +tg([[{v:4,k:"hl"},{v:"",k:""},{v:"",k:""},{v:"",k:""}]])+'</div>'},

 {who:"kelly", say:"Every slide drops a new number onto the board, so <b>the clock here is the space you have left</b>. Fill it up and you are done. That is the only way to lose.",
  show:'<div class="tDemo">'+tg([
    [{v:2},{v:4},{v:2},{v:4}],
    [{v:4},{v:2},{v:4},{v:2}]])+'</div>'
   +'<p class="tNote">Nothing touching matches. Nothing merges. That board is finished.</p>'},

 {who:"kelly", say:"So keep your big numbers <b>in one corner</b> and slide the same two directions. Chasing merges all over the board is how a run ends at 200 instead of 2000.",
  show:'<div class="tDemo">'+tg([
    [{v:"",k:""},{v:"",k:""},{v:"",k:""},{v:"",k:""}],
    [{v:64,k:"hl"},{v:32,k:"hl"},{v:8},{v:2}]])+'</div>'},

 {who:"kelly", say:"Get to <b>2048</b> and you have done it. You can keep going after. Your best score is kept, which is the only reason to have a second go.",
  show:""}
];

</script>
<style>
  #board{display:grid;grid-template-columns:repeat(4,76px);gap:8px;
    background:var(--panel);border:3px solid var(--info);border-radius:8px;padding:8px;
    box-shadow:0 0 34px var(--glow)}
  .t{width:var(--tile,76px);height:var(--tile,76px);border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:27px;background:var(--cell);color:var(--ink);
    transition:transform .09s}
  .t.e{background:var(--cell2)}
  .t.new{animation:pop .16s ease-out both}
  .t.merge{animation:bump .18s ease-out both}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
  #over{position:absolute;inset:0;background:var(--scrim);border-radius:8px;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #over.on{display:flex}
  #over .t2{font-size:19px;letter-spacing:4px;font-weight:900;color:var(--rot)}
  #wrap{position:relative}
</style>
</head>
<body>
<div id="wrap"><div id="board"></div>
  <div id="over"><div class="t2" id="overT">STUCK</div>
    <button style="width:150px" id="retry">PLAY AGAIN</button></div>
  <div id="say"></div>
</div>
<div class="side">
  <h1>THE DOUBLING</h1>
  <div class="tag">SLIDE. EQUAL NUMBERS MERGE.<br>GET TO 2048.</div>
  <div class="box">
    <div class="lab">SCORE</div><div class="big" id="score">0</div>
    <div class="r"><span class="k">BEST TILE</span><span class="v" id="best">2</span></div>
    <div class="r"><span class="k">MOVES</span><span class="v" id="moves">0</span></div>
    <div class="r"><span class="k">BEST EVER</span><span class="v" id="bestever" style="color:var(--ok)">0</span></div>
  </div>
  <div class="box">
    <div class="lab">CONTROLS</div>
    <div class="keys"><kbd>&larr;</kbd><kbd>&rarr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd> slide<br>or swipe</div>
  </div>
  <button id="again">NEW GAME</button>
  <button class="ghost" id="howto" style="margin-top:7px">HOW TO PLAY</button>
</div>
<script>
// THE DOUBLING - 2048, unchanged in its rules because they do not need help.
// Kept here because it is the one game in the arcade with no grid logic at all:
// pure spatial greed, which is a different muscle from every KenKen in the app.
var $=function(s){return document.querySelector(s);};
var G,score,moves,over,hit2048;
// SIZE IS THE DIFFICULTY. 4x4 is the real game; 5x5 gives room to recover from
// a bad slide, 3x3 punishes one immediately.
var DLEVELS=[{n:"ROOMY",N:5},{n:"CLASSIC",N:4},{n:"TIGHT",N:3}];
var dlevel=1;
var N=4;
// a best score that survives the tab is the only reason to play a second run
var BEST_KEY="kkd-doubling-best";
function bestEver(){ try{ return +(localStorage.getItem(BEST_KEY)||0); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem(BEST_KEY,String(v)); }catch(e){} }
function reset(){
  if(window.ARCADE&&ARCADE.clock) ARCADE.clock.start();   // every new board is its own run
  N=DLEVELS[dlevel].N;
  G=[];for(var i=0;i<N*N;i++)G.push(0);
  score=0;moves=0;over=false;hit2048=false;$("#over").className="";
  add();add();draw();say("");
}
function add(){
  var free=[],i;
  for(i=0;i<N*N;i++) if(!G[i]) free.push(i);
  if(!free.length) return;
  G[free[Math.floor(Math.random()*free.length)]] = Math.random()<0.9?2:4;
}
// one row, slid left, with merges. Everything else is rotations of this.
function slide(row){
  var a=row.filter(function(x){return x;}),out=[],i=0,gained=0;
  while(i<a.length){
    if(a[i]===a[i+1]){ out.push(a[i]*2); gained+=a[i]*2; i+=2; }
    else { out.push(a[i]); i++; }
  }
  while(out.length<N) out.push(0);
  return {row:out,gained:gained};
}
function rows(){ var r=[],y;for(y=0;y<N;y++) r.push(G.slice(y*N,y*N+N)); return r; }
function setRows(r){ G=[];for(var y=0;y<N;y++) for(var x=0;x<N;x++) G.push(r[y][x]); }
function tpose(r){ var o=[],y,x;for(y=0;y<N;y++){o.push([]);for(x=0;x<N;x++)o[y].push(r[x][y]);} return o; }
function move(dir){
  if(over) return;
  var r=rows(),y,gained=0,before=G.join(",");
  if(dir==="up"||dir==="down") r=tpose(r);
  for(y=0;y<N;y++){
    var line=r[y].slice();
    var rev=(dir==="right"||dir==="down");
    if(rev) line.reverse();
    var res=slide(line);
    gained+=res.gained;
    if(rev) res.row.reverse();
    r[y]=res.row;
  }
  if(dir==="up"||dir==="down") r=tpose(r);
  setRows(r);
  if(G.join(",")===before) return;          // nothing moved: not a move
  score+=gained; moves++;
  if(gained) SFX.good(); else SFX.tick();
  add(); draw();
  if(stuck()) end();
}
function stuck(){
  var i,x,y;
  for(i=0;i<N*N;i++) if(!G[i]) return false;
  for(y=0;y<N;y++) for(x=0;x<N;x++){
    var v=G[y*N+x];
    if(x<N-1&&G[y*N+x+1]===v) return false;
    if(y<N-1&&G[(y+1)*N+x]===v) return false;
  }
  return true;
}
function end(){
  over=true;
  SFX.no();
  var top=0; for(var z=0;z<N*N;z++) if(G[z]>top) top=G[z];
  ARCADE.report({gameOver:true,score:score,tile:top,moves:moves,n:N});
  if(score>bestEver()) saveBest(score);
  $("#overT").textContent="STUCK";
  $("#over").className="on";
  draw();
}
function say(t){ $("#say").textContent=t||""; }
// THE RAMP IS BUILT FROM THE PAPER, NOT PICKED FROM TWO.
// This carried two hardcoded eleven-step ladders, one for dark and one for
// cream, which is the same problem the boards had: the app has ten papers
// and this had two. The progression is what matters and it is unchanged —
// neutral, then warm, then mint, then violet, then gold at the top — but every
// step is now that skin's own accent mixed over that skin's own board.
var K = (window.ARCADE && window.ARCADE.skin) || null;
var COL = (function () {
  if (!K) return {};
  var s = function (acc, amt) { return K.mix(K.panel, acc, amt); };
  return { 2: s(K.ink, 0.07), 4: s(K.ink, 0.14),
    8: s(K.gold, 0.22), 16: s(K.gold, 0.36), 32: s(K.rot, 0.26), 64: s(K.rot, 0.42),
    128: s(K.ok, 0.26), 256: s(K.ok, 0.4), 512: s(K.ok, 0.56),
    1024: s(K.myst, 0.46), 2048: s(K.gold, 0.72) };
})();
function draw(){
  var h="",i;
  for(i=0;i<N*N;i++){
    var v=G[i];
    var fill = v ? (COL[v] || (K ? K.mix(K.panel, K.gold, 0.8) : "")) : "";
    h+='<div class="t'+(v?"":" e")+'" style="--tile:'+(N>4?62:N<4?92:76)+'px;'+(fill?"background:"+fill+";":"")
      +(v>=1024?"font-size:20px;":v>=128?"font-size:23px;":"")
      // the number sits ON the tile, so it is measured against the tile
      +(fill&&K?"color:"+K.inkOn(fill)+";":"")+'">'+(v||"")+'</div>';
  }
  $("#board").style.gridTemplateColumns="repeat("+N+", "+(N>4?62:N<4?92:76)+"px)";
  $("#board").innerHTML=h;
  var b=0;for(i=0;i<N*N;i++) if(G[i]>b) b=G[i];
  $("#score").textContent=score;
  $("#best").textContent=b;
  $("#moves").textContent=moves;
  $("#bestever").textContent=Math.max(bestEver(),score);
  if(b>=2048&&!hit2048){ hit2048=true; say("2048. Keep going if you want."); ARCADE.report({tile:2048}); }
}
window.addEventListener("keydown",function(e){
  var m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"}[e.key];
  if(m){ e.preventDefault(); move(m); }
});
var tx=0,ty=0;
document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up"));
},{passive:true});
$("#again").onclick=reset; $("#retry").onclick=reset;
reset();
ARCADE.start({
  title: "THE DOUBLING",
  level: function(){ return DLEVELS[dlevel].n; },
  options: [{ label: "BOARD", choices: [["0","5×5"],["1","4×4"],["2","3×3"]],
    value: function(){ return dlevel; }, onPick: function(v){ dlevel = +v; } }],
  blurb: "Slide the board. Equal numbers merge. Get to 2048.",
  lesson: LESSON,
  
  onStart: function(){ reset(); }
});
</script>
</body>
</html>
