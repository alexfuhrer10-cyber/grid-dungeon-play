<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE SUMS</title>
<link rel="stylesheet" href="shell.css?v=524">
<script src="shell.js?v=524"></script>
<script>
// draws a demo grid for the tutorial: [{v,k,cl,wr,wb}, ...] rows
function tg(rows){
  var n=rows[0].length, h='<div class="tG" style="grid-template-columns:repeat('+n+',42px)">';
  for(var r=0;r<rows.length;r++) for(var c=0;c<n;c++){
    var x=rows[r][c]||{};
    h+='<div class="tC '+(x.k||"")+(x.wr?" wr":"")+(x.wb?" wb":"")+'">'
      +(x.cl?'<span class="cl">'+x.cl+'</span>':"")+(x.v===undefined?"":x.v)+'</div>';
  }
  return h+'</div>';
}

var LESSON=[
 {who:"keeper", say:"A number in a corner, and a line of empty squares beneath it. What do you suppose the number is <b>for</b>?",
  show:'<div class="tDemo">'+tg([
    [{cl:"7",k:"blk"},{v:"",k:""},{v:"",k:""}]])+'</div>'
   +'<p class="tNote">It is the total. Those two squares add to seven.</p>'},

 {who:"keeper", say:"Seven from two squares. <b>Which pairs?</b> Not 7 and 0, there is no nought here. Not 3 and 4 only. Ask it properly and the list is short, and a short list is the whole game.",
  show:'<div class="tDemo">'+tg([[{v:1,k:"ok"},{v:6,k:"ok"}]])+tg([[{v:2,k:"ok"},{v:5,k:"ok"}]])+tg([[{v:3,k:"ok"},{v:4,k:"ok"}]])+'</div>'
   +'<p class="tNote">Three pairs, each of them either way round. Never a repeat inside one run.</p>'},

 {who:"keeper", say:"A clue in the <b>top right</b> counts across. One in the <b>bottom left</b> counts down. Every white square belongs to one of each, so it must answer <b>two questions at once</b>. That is where the answer comes from.",
  show:'<div class="tDemo">'+tg([
    [{cl:"4",k:"blk"},{cl:"7",k:"blk",wb:1},{k:"blk"}],
    [{cl:"7",k:"blk"},{v:"?",k:"hl"},{v:"",k:""}],
    [{cl:"5",k:"blk"},{v:"",k:""},{k:"blk"}]])+'</div>'
   +'<p class="tNote">That square sits in a 7 across and a 7 down. Both have to be true of it.</p>'},

 {who:"keeper", say:"A few squares are printed to start you. Everything else you find. <b>What would you like the first one to be?</b> It does not matter. Find the run with the fewest ways to be true, and begin there.",
  show:""}
];

</script>
<style>
  #grid{display:grid;background:var(--panel);border:3px solid var(--info);border-radius:5px;
    box-shadow:0 0 34px var(--glow)}
  .c{width:54px;height:54px;position:relative;display:flex;align-items:center;justify-content:center;
    border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
    font-size:21px;font-weight:800;color:var(--ok)}
  .c.blk{background:var(--cell2);cursor:default}
  .c.open{cursor:pointer;background:transparent}
  .c.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--gold)}
  .c.bad{color:var(--rot)}
  .c.run{background:var(--cage)}
  .c.printed{color:var(--ink);background:var(--cell)}
  .slash{position:absolute;inset:0;pointer-events:none}
  .slash::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;
    background:linear-gradient(to bottom right,transparent 49%,var(--rule2) 49%,var(--rule2) 51%,transparent 51%)}
  .dn{position:absolute;left:4px;bottom:2px;font-size:11px;font-weight:900;color:var(--gold)}
  .ac{position:absolute;right:4px;top:2px;font-size:11px;font-weight:900;color:var(--info)}
  .pad{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap;max-width:330px}
  .pad button{width:auto;flex:1 1 30px;padding:11px 0;font-size:15px;
    border-color:var(--info);color:var(--info);background:var(--btn)}
  .pad button.era{flex:1 1 74px;font-size:10px;border-color:var(--line);color:var(--dim);background:transparent}
</style>
</head>
<body>
<div>
  <div id="grid"></div>
  <div class="pad" id="pad"></div>
  <div id="say"></div>
</div>
<div class="side">
  <h1>THE SUMS</h1>
  <div class="tag">EACH RUN ADDS TO ITS CLUE.<br>NO DIGIT TWICE IN A RUN.</div>
  <div class="box">
    <div class="lab">EMPTY SQUARES</div><div class="big" id="left">0</div>
    <div class="r"><span class="k">THIS RUN WANTS</span><span class="v" id="want" style="color:var(--gold)">-</span></div>
    <div class="r"><span class="k">SO FAR</span><span class="v" id="sofar">-</span></div>
  </div>
  <div class="box">
    <div class="lab">HOW IT WORKS</div>
    <div style="font-size:11.5px;color:var(--dim);line-height:1.6">
      A clue in the <b style="color:var(--info)">top right</b> is the sum of the run going
      <b>across</b>. One in the <b style="color:var(--gold)">bottom left</b> is the run going
      <b>down</b>. Digits are 1 to 9 and <b>never repeat inside one run</b>.
    </div>
  </div>
  <button id="again">NEW GRID</button>
  <button class="ghost" id="howto" style="margin-top:7px">HOW TO PLAY</button>
</div>
<script>
// THE SUMS - Kakuro. Every run of white squares adds up to its clue and never
// repeats a digit inside itself.
//
// It belongs in this cabinet because it is the closest cousin KenKen has: both
// are "a set of squares, a target, and no repeats". The difference is that a
// KenKen cage is a blob with any operation and a Kakuro run is always a
// straight line and always a sum, so it is the gentler of the two and a fair
// place to learn the habit of asking WHICH SET OF DIGITS can make this number.
var $=function(s){return document.querySelector(s);};
var W=7,H=7;
var blk,sol,cell,sel,runs,given;

function id(x,y){return y*W+x;}
// GRID SHAPES THAT VARY, and the honest story of how.
//
// The first build had ONE hand-drawn skeleton, so every board was the same
// puzzle wearing different numbers. The shape IS the puzzle in a Kakuro, so
// that was the flaw worth fixing.
//
// The obvious fix, scattering blocks at random, does not work, and it is worth
// writing down why rather than quietly abandoning it. A Kakuro is pinned down
// by CROSSINGS: every white square must sit in an across run AND a down run, so
// that it has to satisfy two sums at once. Measured over eighty random layouts,
// exactly ONE satisfied that. Grids that did not have crossings had four or
// more answers every single time.
//
// Real Kakuro grids are designed, not rolled. So these are designed: a set of
// skeletons that are known to cross everywhere, mirrored and flipped for more
// variety, with the digits and therefore the clues fresh every time. Eight
// shapes beats one, and unlike a random roll every one of them works.
var SKELETONS = [
  ["#######",
   "#...###",
   "#...###",
   "#...###",
   "####...",
   "####...",
   "####..."],

  ["#######",
   "###..##",
   "###..##",
   "#......",
   "#......",
   "###..##",
   "###..##"],

  ["#######",
   "#..####",
   "#..####",
   "#.....#",
   "#.....#",
   "####..#",
   "####..#"],

  ["#######",
   "#..#..#",
   "#..#..#",
   "#..#..#",
   "#.....#",
   "#.....#",
   "#######"]
];
function mirror(rows){ return rows.map(function(r){ return r.split("").reverse().join(""); }); }
function flip(rows){ return rows.slice().reverse(); }

function buildSkeleton(){
  var base = SKELETONS[Math.floor(Math.random()*SKELETONS.length)];
  var pat = base;
  // the clue squares have to stay along the top and the left, so only the
  // transforms that keep that edge solid are used
  if(Math.random()<0.5) pat = mirror(pat).map(function(r){ return "#" + r.slice(1); });
  if(Math.random()<0.5) pat = flip(pat).map(function(r,i){ return i===0 ? "#######" : r; });
  blk=[];
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){
    var row=pat[y]||"#######";
    blk.push(row[x]==="#"||row[x]===undefined);
  }
  // the top row and left column are always clue squares
  for(var i=0;i<W;i++) blk[i]=true;
  for(var y2=0;y2<H;y2++) blk[y2*W]=true;
  runs=findRuns();
  // and prove the crossings really are there rather than trusting the drawing
  var acr={},dwn={},k,q;
  for(k=0;k<runs.length;k++)
    for(q=0;q<runs[k].cells.length;q++)
      (runs[k].dir==="a"?acr:dwn)[runs[k].cells[q]]=1;
  for(k=0;k<W*H;k++) if(!blk[k] && (!acr[k]||!dwn[k])) return false;
  return runs.length>=8;
}

// every maximal straight line of open squares, across and down
function findRuns(){
  var out=[],x,y,i;
  for(y=0;y<H;y++){
    var cur=[];
    for(x=0;x<W;x++){
      i=id(x,y);
      if(blk[i]){ if(cur.length>1) out.push({dir:"a",cells:cur}); cur=[]; }
      else cur.push(i);
    }
    if(cur.length>1) out.push({dir:"a",cells:cur});
  }
  for(x=0;x<W;x++){
    var cur2=[];
    for(y=0;y<H;y++){
      i=id(x,y);
      if(blk[i]){ if(cur2.length>1) out.push({dir:"d",cells:cur2}); cur2=[]; }
      else cur2.push(i);
    }
    if(cur2.length>1) out.push({dir:"d",cells:cur2});
  }
  return out;
}
// fill the open squares so no run repeats a digit; the clues come from the fill
function solveFill(){
  var order=[],i;
  for(i=0;i<W*H;i++) if(!blk[i]) order.push(i);
  var g=new Array(W*H).fill(0);
  var mine={};
  for(i=0;i<runs.length;i++) for(var k=0;k<runs[i].cells.length;k++){
    var c=runs[i].cells[k];
    (mine[c]=mine[c]||[]).push(i);
  }
  var ok=(function rec(k){
    if(k===order.length) return true;
    var c=order[k],vs=[1,2,3,4,5,6,7,8,9],a,b,t;
    for(a=vs.length-1;a>0;a--){ b=Math.floor(Math.random()*(a+1)); t=vs[a];vs[a]=vs[b];vs[b]=t; }
    for(a=0;a<9;a++){
      var v=vs[a],clash=false;
      var rs=mine[c]||[];
      for(b=0;b<rs.length && !clash;b++){
        var cs=runs[rs[b]].cells;
        for(var q=0;q<cs.length;q++) if(cs[q]!==c && g[cs[q]]===v){ clash=true; break; }
      }
      if(clash) continue;
      g[c]=v;
      if(rec(k+1)) return true;
      g[c]=0;
    }
    return false;
  })(0);
  return ok?g:null;
}
// HOW MANY WAYS DOES THIS GRID ADD UP?
// A Kakuro with two answers is not a Kakuro. Same discipline as the Sudoku next
// to it: the board is counted before it is shown, and thrown away if it is not
// pinned to exactly one.
// WITH A BUDGET, because the honest answer to "how many ways" is sometimes
// "more than I can count before the tab freezes". A grid whose search runs past
// the budget is not a tight puzzle by definition, so exhausting the budget is
// treated as ambiguous and the grid is thrown away. Better a rejected grid than
// a hung game.
var FILL_BUDGET = 120000;
function countFills(cap){
  var order=[],i,steps=0;
  for(i=0;i<W*H;i++) if(!blk[i]) order.push(i);
  var g=new Array(W*H).fill(0), found=0;
  for(i=0;i<W*H;i++) if(given && given[i]) g[i]=cell[i];
  var mine={};
  for(i=0;i<runs.length;i++) for(var k=0;k<runs[i].cells.length;k++)
    (mine[runs[i].cells[k]]=mine[runs[i].cells[k]]||[]).push(i);
  var blown=false;
  (function rec(k){
    if(found>=cap||blown) return;
    if(++steps>FILL_BUDGET){ blown=true; return; }
    if(k===order.length){ found++; return; }
    var c=order[k],rs=mine[c]||[],v,b,q;
    if(given && given[c]){ rec(k+1); return; }
    for(v=1;v<=9;v++){
      var ok=true;
      for(b=0;b<rs.length && ok;b++){
        var rn=runs[rs[b]],cs=rn.cells,sum=v,blanks=0;
        for(q=0;q<cs.length;q++){
          if(cs[q]===c) continue;
          if(g[cs[q]]===v){ ok=false; break; }
          if(g[cs[q]]) sum+=g[cs[q]]; else blanks++;
        }
        if(!ok) break;
        if(sum>rn.sum) ok=false;
        else if(blanks===0 && sum!==rn.sum) ok=false;
        else if(blanks>0 && sum+blanks*9 < rn.sum) ok=false;
      }
      if(!ok) continue;
      g[c]=v; rec(k+1); g[c]=0;
      if(found>=cap||blown) return;
    }
  })(0);
  return blown ? cap : found;      // could not be pinned in time: call it loose
}
// A MINIMAL KAKURO IS ALREADY HARD. The generator strips every given that is
// not load bearing, so the honest dial runs the other way: EASY hands back a
// few of the squares it just took, HARD keeps the bare minimum.
var KKLEVELS=[{n:"EASY",extra:5},{n:"STEADY",extra:2},{n:"HARD",extra:0}];
var kklevel=1;
function reset(){
  if(window.ARCADE&&ARCADE.clock) ARCADE.clock.start();   // every new board is its own run
  for(var attempt=0;attempt<40;attempt++){
    if(!buildSkeleton()) continue;
    sol=null;
    for(var t=0;t<25 && !sol;t++) sol=solveFill();
    if(!sol) continue;
    for(var i=0;i<runs.length;i++){
      var sum=0;
      for(var k=0;k<runs[i].cells.length;k++) sum+=sol[runs[i].cells[k]];
      runs[i].sum=sum;
    }
    // Crossings do most of the work but not always all of it. Rather than throw
    // away a good-looking grid, the fewest possible squares are PRINTED until
    // the answer is pinned, exactly as the Sudoku beside it does. Usually none
    // are needed; occasionally one or two are.
    cell=new Array(W*H).fill(0);
    given=new Array(W*H).fill(false);
    var openIdx=[];
    for(i=0;i<W*H;i++) if(!blk[i]) openIdx.push(i);
    for(i=openIdx.length-1;i>0;i--){ var j2=Math.floor(Math.random()*(i+1)); var t2=openIdx[i];openIdx[i]=openIdx[j2];openIdx[j2]=t2; }
    var guard=0;
    while(countFills(2)!==1 && guard<openIdx.length){
      var g2=openIdx[guard++];
      given[g2]=true; cell[g2]=sol[g2];
    }
    if(countFills(2)!==1) continue;      // still loose: this grid is not a puzzle

    // THEN TAKE BACK EVERY ONE THAT WAS NOT NEEDED.
    //
    // Adding givens until the answer is pinned overshoots badly: it stops at
    // whatever random square happened to tip it, so an earlier one is often
    // doing nothing. Measured before this pass, boards were printing up to 15
    // of their 22 squares, which leaves seven to solve and is not a puzzle.
    // Every given is now tried for removal and only kept if the board goes
    // loose without it, so what remains is the fewest that hold the answer.
    for(i=0;i<openIdx.length;i++){
      var gi=openIdx[i];
      if(!given[gi]) continue;
      given[gi]=false; var keep=cell[gi]; cell[gi]=0;
      if(countFills(2)!==1){ given[gi]=true; cell[gi]=keep; }
    }
    // hand some back, if the player asked for an easier board
    var spare=[];
    for(i=0;i<openIdx.length;i++) if(!given[openIdx[i]]) spare.push(openIdx[i]);
    for(i=0;i<KKLEVELS[kklevel].extra && spare.length;i++){
      var pick=spare.splice(Math.floor(Math.random()*spare.length),1)[0];
      given[pick]=true; cell[pick]=sol[pick];
    }
    sel=-1; say(""); draw();
    return;
  }
  say("could not build a grid. press NEW GRID",true);
}
function runsAt(i){
  var out=[];
  for(var k=0;k<runs.length;k++) if(runs[k].cells.indexOf(i)>=0) out.push(runs[k]);
  return out;
}
// the clue square for a run sits immediately before its first cell
function clueFor(i){
  var out={a:null,d:null},k;
  for(k=0;k<runs.length;k++){
    var cs=runs[k].cells, first=cs[0];
    if(runs[k].dir==="a" && first===i+1 && (i%W)+1===first%W) out.a=runs[k].sum;
    if(runs[k].dir==="d" && first===i+W) out.d=runs[k].sum;
  }
  return out;
}
function put(v){
  if(sel<0||blk[sel]) return;
  if(given[sel]){ say("That one is printed."); return; }
  if(v===0){ cell[sel]=0; say(""); draw(); return; }
  // the two Kakuro rules, said out loud
  var rs=runsAt(sel),k,q;
  for(k=0;k<rs.length;k++){
    var cs=rs[k].cells;
    for(q=0;q<cs.length;q++) if(cs[q]!==sel && cell[cs[q]]===v){
      say("That run already has a "+v+".",true); return;
    }
  }
  cell[sel]=v;
  for(k=0;k<rs.length;k++){
    var cs2=rs[k].cells,sum=0,full=true;
    for(q=0;q<cs2.length;q++){ if(!cell[cs2[q]]) full=false; sum+=cell[cs2[q]]; }
    if(full && sum!==rs[k].sum){
      say("That run adds to "+sum+" and it wants "+rs[k].sum+".",true);
      draw(); return;
    }
    if(sum>rs[k].sum){ say("That run is already over "+rs[k].sum+".",true); draw(); return; }
  }
  SFX.place(); say(""); draw();
  var done=true;
  for(k=0;k<W*H;k++) if(!blk[k]&&!cell[k]) done=false;
  if(done){
    var right=true;
    for(k=0;k<runs.length;k++){
      var s=0,cs3=runs[k].cells;
      for(q=0;q<cs3.length;q++) s+=cell[cs3[q]];
      if(s!==runs[k].sum) right=false;
    }
    if(right){ SFX.win(); ARCADE.report({solved:true,runs:runs.length,mistakes:0}); } else SFX.no();
    say(right?"Every run adds up. Solved.":"Full, but a run is wrong.",!right);
  }
}
function say(t,bad){ var e=$("#say"); e.textContent=t||""; e.className=bad?"no":""; }
function draw(){
  $("#grid").style.gridTemplateColumns="repeat("+W+",54px)";
  var h="",i;
  var selRuns = sel>=0 ? runsAt(sel) : [];
  for(i=0;i<W*H;i++){
    var cls="c", inner="";
    if(blk[i]){
      cls+=" blk";
      var cl=clueFor(i);
      if(cl.a!==null||cl.d!==null){
        inner+='<span class="slash"></span>';
        if(cl.a!==null) inner+='<span class="ac">'+cl.a+'</span>';
        if(cl.d!==null) inner+='<span class="dn">'+cl.d+'</span>';
      }
    } else {
      cls+=" open";
      if(given[i]) cls+=" printed";
      if(i===sel) cls+=" sel";
      else { for(var k=0;k<selRuns.length;k++) if(selRuns[k].cells.indexOf(i)>=0){ cls+=" run"; break; } }
      if(cell[i]) inner+=cell[i];
    }
    h+='<div class="'+cls+'" data-i="'+i+'">'+inner+'</div>';
  }
  $("#grid").innerHTML=h;
  var e=0; for(i=0;i<W*H;i++) if(!blk[i]&&!cell[i]) e++;
  $("#left").textContent=e;
  if(sel>=0&&selRuns.length){
    var r0=selRuns[0],s=0;
    for(var q=0;q<r0.cells.length;q++) s+=cell[r0.cells[q]];
    $("#want").textContent=r0.sum;
    $("#sofar").textContent=s;
  } else { $("#want").textContent="-"; $("#sofar").textContent="-"; }
}
$("#grid").addEventListener("click",function(e){
  var d=e.target.closest(".c"); if(!d) return;
  var i=+d.dataset.i; if(blk[i]) return;
  sel=i; SFX.tick(); draw();
});
(function(){
  var h="",v;
  for(v=1;v<=9;v++) h+='<button data-v="'+v+'">'+v+'</button>';
  h+='<button class="era" data-v="0">RUB OUT</button>';
  $("#pad").innerHTML=h;
  $("#pad").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return; put(+b.dataset.v);
  });
})();
window.addEventListener("keydown",function(e){
  if(/^[1-9]$/.test(e.key)) put(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete") put(0);
});
$("#again").onclick=reset;
window.addEventListener("error",function(e){ say("BROKE: "+e.message,true); });
reset();
ARCADE.start({
  title: "THE SUMS",
  level: function(){ return KKLEVELS[kklevel].n; },
  options: [{ label: "DIFFICULTY", choices: [["0","EASY"],["1","STEADY"],["2","HARD"]],
    value: function(){ return kklevel; }, onPick: function(v){ kklevel = +v; } }],
  blurb: "Kakuro. Every run of squares adds to its clue and never repeats a digit.",
  lesson: LESSON,
  
  onStart: function(){ reset(); }
});
</script>
</body>
</html>
